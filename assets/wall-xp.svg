    <ellipse cx="470" cy="245" rx="250" ry="48" fill="url(#cloud)"/>
    <ellipse cx="1160" cy="165" rx="270" ry="60" fill="url(#cloud)"/>
    <ellipse cx="1330" cy="215" rx="200" ry="46" fill="url(#cloud)"/>
    <ellipse cx="820" cy="110" rx="190" ry="40" fill="url(#cloud)" opacity="0.65"/>
    <ellipse cx="640" cy="330" rx="160" ry="34" fill="url(#cloud)" opacity="0.5"/>
  </g>
  <rect x="0" y="560" width="1600" height="90" fill="#eaf6ff" opacity="0.45" filter="url(#blur)"/>
  <path d="M0,648 C 360,560 760,602 1120,576 C 1340,560 1500,602 1600,586 L1600,900 L0,900 Z" fill="url(#hill)"/>
  <path d="M0,648 C 360,560 760,602 1120,576 C 1340,560 1500,602 1600,586" fill="none" stroke="#d4ea8c" stroke-width="12" opacity="0.55" filter="url(#blur)"/>
