<!doctype html>
<!--
  Source for public/og.png (the 1200×630 social share image). It mirrors the home page's hero:
  the dark screen, the slogan in Space Mono (white, then blue), and the riva bloom.
  Regenerate: serve the repo root (e.g. `python3 -m http.server 8090`), open
  http://localhost:8090/tools/og.html at a 1200×630 viewport, and screenshot it
  (2× device scale, then downscale to 1200×630 for crisp text). Then bump ?v= on the
  og:image / twitter:image URLs (public/index.html and public/desktop/index.html).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>og</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Space+Mono:wght@700&display=block">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;-webkit-font-smoothing:antialiased}
  body{position:relative;color:#fff;font-family:Inter,system-ui,sans-serif;text-align:center;
    background:radial-gradient(780px 340px at 50% 100%,rgba(40,120,255,.5),rgba(40,120,255,0) 72%),radial-gradient(900px 420px at 50% 0,rgba(61,155,240,.16),rgba(61,155,240,0) 70%),linear-gradient(180deg,#0b1b30,#060f1d)}
  .logo{position:absolute;left:50%;top:52px;height:68px;transform:translateX(-50%)}
  h1{position:absolute;left:0;right:0;top:172px;margin:0;font:700 66px/1.2 "Space Mono",ui-monospace,monospace;letter-spacing:-.05em}
  h1 span{display:block}
  h1 .hl{color:#3d9bf0}
  .cur{display:inline-block;width:.42em;height:.86em;margin-left:.12em;vertical-align:-.08em;background:currentColor}
  p{position:absolute;left:0;right:0;top:366px;margin:0;font:500 30px/1.3 Inter,system-ui,sans-serif;color:rgba(255,255,255,.92)}
  .bloom{position:absolute;left:50%;bottom:-222px;width:1000px;transform:translateX(-50%);
    -webkit-mask-image:linear-gradient(to top,#000 40%,rgba(0,0,0,.3) 60%,transparent 80%);mask-image:linear-gradient(to top,#000 40%,rgba(0,0,0,.3) 60%,transparent 80%)}
</style>
</head>
<body>
<img class="logo" src="../public/brand/riva-computech-logo-white.svg" alt="">
<h1><span>You mind your business.</span><span class="hl">We'll mind your computers.<i class="cur"></i></span></h1>
<p>IT support for small businesses</p>
<!-- the same bloom as the home page's hero -->
<svg class="bloom" viewBox="-700 -640 1400 860" aria-hidden="true" focusable="false">
  <defs>
    <path id="petal" d="M0 0C64-118 196-292 158-498C92-470 18-398-22-300C-58-206-42-84 0 0Z"/>
    <linearGradient id="pb" x1=".5" y1="1" x2=".5" y2="0"><stop offset="0" stop-color="#0a3a8f"/><stop offset="1" stop-color="#1d6bd4"/></linearGradient>
    <linearGradient id="pm" x1=".5" y1="1" x2=".5" y2="0"><stop offset="0" stop-color="#0a3a8f"/><stop offset=".6" stop-color="#1d6bd4"/><stop offset="1" stop-color="#52b0ff"/></linearGradient>
    <linearGradient id="pf" x1=".2" y1="1" x2=".6" y2="0"><stop offset="0" stop-color="#1d6bd4"/><stop offset=".55" stop-color="#52b0ff"/><stop offset="1" stop-color="#bfe5ff"/></linearGradient>
    <radialGradient id="pc"><stop offset="0" stop-color="#bfe5ff" stop-opacity=".95"/><stop offset="1" stop-color="#52b0ff" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <g filter="url(#soft)" opacity=".9" fill="url(#pb)">
    <use href="#petal" transform="rotate(-128) scale(1.12)"/><use href="#petal" transform="rotate(-82) scale(1.2)"/><use href="#petal" transform="rotate(-36) scale(1.18)"/><use href="#petal" transform="rotate(10) scale(1.14)"/>
    <use href="#petal" transform="rotate(56) scale(1.06)"/><use href="#petal" transform="rotate(102) scale(.96)"/><use href="#petal" transform="rotate(148) scale(.9)"/>
  </g>
  <g opacity=".92" fill="url(#pm)">
    <use href="#petal" transform="rotate(-105)"/><use href="#petal" transform="rotate(-59) scale(1.06)"/><use href="#petal" transform="rotate(-13) scale(1.04)"/>
    <use href="#petal" transform="rotate(33) scale(.98)"/><use href="#petal" transform="rotate(79) scale(.9)"/><use href="#petal" transform="rotate(125) scale(.84)"/>
  </g>
  <g opacity=".78" fill="url(#pf)" style="mix-blend-mode:screen">
    <use href="#petal" transform="rotate(-84) scale(.78)"/><use href="#petal" transform="rotate(-38) scale(.82)"/><use href="#petal" transform="rotate(8) scale(.8)"/>
    <use href="#petal" transform="rotate(54) scale(.72)"/><use href="#petal" transform="rotate(100) scale(.64)"/>
  </g>
  <circle r="120" fill="url(#pc)"/>
</svg>
<script>document.fonts.ready.then(() => { document.body.dataset.ready = "1"; });</script>
</body>
</html>
