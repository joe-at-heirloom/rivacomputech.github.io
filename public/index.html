<h1 class="sr-only">Riva Computech: senior Microsoft 365, Azure &amp; infrastructure IT help</h1>
<p class="sr-only">This site is rivaOS, a desktop that runs in your browser. Use the taskbar or the Start menu to open Services, the IT health check, About Devik and Contact.</p>

<noscript>
  <main class="nojs">
    <h2>Riva Computech</h2>
    <p><b>The IT person who actually picks up the phone.</b> Senior Microsoft 365, Azure and infrastructure support, direct from the engineer who does the work. No ticket queues, no hand-offs, and cover across evenings, weekends and holidays.</p>
    <h3>Services</h3>
    <ul>
      <li><b>Microsoft 365</b>: tenant setup &amp; licensing, Exchange Online, SharePoint &amp; OneDrive, ongoing admin.</li>
      <li><b>Azure &amp; identity</b>: Azure tenant management, Entra ID &amp; Active Directory, hybrid identity, Group Policy.</li>
      <li><b>Migrations</b>: email &amp; mailbox, tenant-to-tenant, file &amp; data, minimal-disruption cutovers.</li>
      <li><b>Backup &amp; continuity</b>: backup &amp; recovery, BC/DR, restore testing, proactive monitoring.</li>
      <li><b>Devices &amp; security</b>: Intune device management, endpoint &amp; email security, EDR / SIEM monitoring.</li>
      <li><b>Infrastructure &amp; network</b>: servers &amp; storage, VMware, Hyper-V &amp; Citrix, firewalls &amp; VPNs, DNS &amp; NAS.</li>
      <li><b>PowerShell automation</b>: repetitive admin, scripted so it's done the same way every time.</li>
    </ul>
    <h3>About</h3>
    <p>Devik Patel, owner and senior engineer, with 10+ years of hands-on IT: help desk, Windows Server, virtualization and, these days, a lot of Microsoft 365 and Azure.</p>
    <h3>Contact</h3>
    <p>Email <a href="mailto:rivacomputech@gmail.com">rivacomputech@gmail.com</a> · Phone <a href="tel:+13134057164">+1 (313) 405-7164</a><br />Weekdays, evenings, weekends &amp; holidays.</p>
    <p><small>Turn on JavaScript to use the full rivaOS desktop.</small></p>
  </main>
